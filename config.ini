# Configuration file for Pinnacle Building Compliance Platform

[server]
host = 0.0.0.0
port = 8000
reload = false
workers = 4

[database]
# PostgreSQL connection for regulations database
postgres_url = postgresql://localhost:5432/bpb26_regulations
# SQLite for project data
sqlite_path = ./data/projects.db

[ai]
# AI model configuration
model_path = ./models
confidence_threshold = 0.7
enable_gpu = false

[compliance]
# Compliance engine settings
auto_fix_enabled = false
default_jurisdiction = International
strict_mode = false

[logging]
level = INFO
format = json
log_file = ./logs/bpb26.log

[security]
# Security settings for production
enable_cors = true
allowed_origins = *
api_key_required = false
